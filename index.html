<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>دعوة وائل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f7f4ef;
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    body {
      color: #000;
    }

    /* =========================
       الغلاف الأول
    ========================= */

    #cover {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #f7f4ef;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .tap-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #000;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      animation: pulse 1.8s infinite;
      z-index: 10;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .45;
      }
    }

    /* =========================
       الدعوة
    ========================= */

    #invitation {
      position: relative;
      width: 100%;
      max-width: 500px;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      display: none;
      background: #f7f4ef;
    }

    .background-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      padding: 55px 18px 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* =========================
       البسملة
    ========================= */

    .bismillah {
      color: #000;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* =========================
       العنوان
    ========================= */

    .title {
      font-family: "Aref Ruqaa", serif;
      color: #000;
      font-size: clamp(55px, 15vw, 78px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }

    .gold-line {
      width: 115px;
      height: 2px;
      background: #c6a15b;
      margin: 4px auto 14px;
      border-radius: 10px;
    }

    .welcome {
      color: #000;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    /* =========================
       اسم الطفل
    ========================= */

    .baby-name {
      font-family: "Aref Ruqaa", serif;
      color: #000;
      font-size: clamp(95px, 25vw, 135px);
      font-weight: 700;
      line-height: .95;
      margin-bottom: 8px;
    }

    .baby-caption {
      color: #000;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    /* =========================
       معلومات الحفل
    ========================= */

    .info-card {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 20px;
    }

    .info-row {
      width: 100%;
      min-height: 61px;
      padding: 8px 15px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(198,161,91,.35);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .info-label {
      color: #000;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 1px;
    }

    .info-value {
      color: #000;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }

    /* =========================
       العد التنازلي
    ========================= */

    .count-title {
      color: #000;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .countdown {
      display: flex;
      direction: ltr;
      justify-content: center;
      gap: 7px;
      margin-bottom: 17px;
    }

    .count-box {
      width: 66px;
      height: 70px;
      border-radius: 17px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(198,161,91,.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .number {
      color: #000;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .label {
      color: #000;
      font-size: 9px;
      font-weight: 600;
      margin-top: 5px;
    }

    /* =========================
       الختام
    ========================= */

    .heart {
      color: #c6a15b;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .closing {
      color: #000;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.8;
      max-width: 350px;
    }

    /* =========================
       زر الموسيقى
    ========================= */

    #musicButton {
      position: fixed;
      right: 18px;
      bottom: 20px;

      width: 50px;
      height: 50px;

      border: 1px solid rgba(198,161,91,.6);
      border-radius: 50%;

      background: rgba(255,255,255,.9);
      color: #000;

      display: none;
      align-items: center;
      justify-content: center;

      font-size: 21px;
      cursor: pointer;

      z-index: 999;

      box-shadow: 0 4px 15px rgba(0,0,0,.12);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #musicButton.playing {
      animation: musicPulse 1.5s infinite;
    }

    @keyframes musicPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    /* =========================
       الهاتف
    ========================= */

    @media (max-width: 380px) {

      .content {
        padding-top: 40px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .baby-name {
        font-size: 90px;
      }

      .info-value {
        font-size: 15px;
      }

      .count-box {
        width: 61px;
        height: 66px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       الغلاف
  ========================= -->

  <div id="cover" onclick="openInvitation()">

    <img
      src="cover.png"
      alt="دعوة وائل"
      class="cover-image"
    >

    <div class="tap-hint">
      اضغط لفتح الدعوة
    </div>

  </div>


  <!-- =========================
       الموسيقى
  ========================= -->

  <audio
    id="backgroundMusic"
    src="music.mp3"
    loop
    preload="auto">
  </audio>


  <!-- =========================
       الدعوة
  ========================= -->

  <main id="invitation">

    <img
      src="background.png"
      alt=""
      class="background-image"
    >

    <div class="content">

      <div class="bismillah">
        بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ
      </div>

      <div class="title">
        دعوة
      </div>

      <div class="gold-line"></div>

      <div class="welcome">
        بكل حب وفرح ندعوكم لمشاركتنا
      </div>

      <div class="baby-name">
        وائل
      </div>

      <div class="baby-caption">
        في يومه المميز
      </div>


      <!-- المعلومات -->

      <div class="info-card">

        <div class="info-row">
          <div class="info-label">
            التاريخ
          </div>

          <div class="info-value">
            3 أكتوبر 2026
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">
            الساعة
          </div>

          <div class="info-value">
            14:30
          </div>
        </div>


        <div class="info-row">

          <div class="info-label">
            المكان
          </div>

          <div class="info-value">
            حي العقيد عميروش 4، الرغاية، رقم المنزل 20
          </div>

        </div>

      </div>


      <!-- العد التنازلي -->

      <div class="count-title">
        لموعدنا الجميل
      </div>

      <div class="countdown">

        <div class="count-box">
          <div class="number" id="days">00</div>
          <div class="label">يوم</div>
        </div>

        <div class="count-box">
          <div class="number" id="hours">00</div>
          <div class="label">ساعة</div>
        </div>

        <div class="count-box">
          <div class="number" id="minutes">00</div>
          <div class="label">دقيقة</div>
        </div>

        <div class="count-box">
          <div class="number" id="seconds">00</div>
          <div class="label">ثانية</div>
        </div>

      </div>


      <div class="heart">
        ♥
      </div>

      <div class="closing">
        حضوركم يسعدنا ويجعل فرحتنا أجمل
      </div>

    </div>

  </main>


  <!-- =========================
       زر الموسيقى
  ========================= -->

  <button
    id="musicButton"
    onclick="toggleMusic(event)"
    aria-label="الموسيقى">
    ♪
  </button>


  <script>

    const cover = document.getElementById("cover");
    const invitation = document.getElementById("invitation");
    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");


    /* =========================
       فتح الدعوة
    ========================= */

    function openInvitation() {

      music.volume = 0.75;

      music.play()
        .then(() => {
          setMusicState(true);
        })
        .catch(() => {
          setMusicState(false);
        });

      cover.style.display = "none";
      invitation.style.display = "block";
      musicButton.style.display = "flex";

      window.scrollTo({
        top: 0,
        behavior: "instant"
      });
    }


    /* =========================
       الموسيقى
    ========================= */

    function toggleMusic(event) {

      if (event) {
        event.stopPropagation();
      }

      if (music.paused) {

        music.play()
          .then(() => {
            setMusicState(true);
          })
          .catch(() => {
            setMusicState(false);
          });

      } else {

        music.pause();
        setMusicState(false);

      }
    }


    function setMusicState(isPlaying) {

      if (isPlaying) {

        musicButton.innerHTML = "♫";
        musicButton.classList.add("playing");

      } else {

        musicButton.innerHTML = "♪";
        musicButton.classList.remove("playing");

      }
    }


    /* =========================
       العد التنازلي
    ========================= */

    const targetDate =
      new Date("2026-10-03T14:30:00+01:00").getTime();


    function updateCountdown() {

      const now = new Date().getTime();

      const difference = targetDate - now;


      if (difference <= 0) {

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        return;
      }


      const days =
        Math.floor(difference / (1000 * 60 * 60 * 24));

      const hours =
        Math.floor(
          (difference % (1000 * 60 * 60 * 24))
          / (1000 * 60 * 60)
        );

      const minutes =
        Math.floor(
          (difference % (1000 * 60 * 60))
          / (1000 * 60)
        );

      const seconds =
        Math.floor(
          (difference % (1000 * 60))
          / 1000
        );


      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }


    updateCountdown();

    setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
